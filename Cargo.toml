[package]
name = "mununu"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Mariano Cerrutti <vscorza@gmail.com>"]
description = "CLTS Verification Tool - Formal verification for reactive systems"
repository = "https://github.com/vscorza/mununu"
license-file = "LICENSE"
keywords = ["formal-verification", "reactive-systems", "model-checking", "synthesis", "ltl"]
categories = ["science", "algorithms", "development-tools"]

[dependencies]
# Core
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitvec = "1.0"
smallvec = "1.15"
regex = "1.12"

# CLI (optional)
clap = { version = "4.5", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3.22", optional = true, features = ["env-filter"] }

# API (optional)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace"] }
tokio = { version = "1", optional = true, features = ["full"] }

[dev-dependencies]
criterion = "0.8"
proptest = "1.9"
tempfile = "3.24"
itoa = "1.0"
assert_cmd = "2.1"
predicates = "3.1"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing", "dep:tracing-subscriber"]
api = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio"]

[[bin]]
name = "mununu"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = 0

[profile.test]
debug = true
opt-level = 1

[[bench]]
name = "clts_composition"
harness = false

[[bench]]
name = "mu_calculus"
harness = false

[[bench]]
name = "controller"
harness = false
