name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  contents: read

env:
  CI: true

jobs:
  # Build the pinned dev image once and run the same `make ci` line that
  # contributors use locally. The hw-verif principle: same docker run
  # invocation must work locally and in CI — if it doesn't, the contract
  # is broken.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mununu-dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: mununu-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run lint + tests in the dev image
        run: |
          docker run --rm -v ${{ github.workspace }}:/work mununu-dev:latest \
            make ci

      - name: Run API-feature tests in the dev image
        run: |
          docker run --rm -v ${{ github.workspace }}:/work mununu-dev:latest \
            cargo test --lib api --features api

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked
      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          if command -v cargo-outdated &> /dev/null; then
            cargo outdated || echo "Some dependencies are outdated. Run 'cargo outdated' locally to see details."
          else
            echo "cargo-outdated not available. Skipping outdated dependency check."
          fi
