# v4_mesi_parametric / n2 — V.4 of the §Phase 7 domain-validation track.
# Controlling doc: docs/design/industrial-value-and-validation-domains.md §3
# (parameterised cache coherence). GENERATED by ../generate.py — do not
# hand-edit. 2 L1 caches over one tracked line + shared memory, free
# environment driving. Sharp-everywhere (explicit async composition);
# definite 2-valued verdicts directly — no CEGAR / KleeneBot needed at
# this scale (stronger than the plan's 'CEGAR converge' criterion).
#
# Properties (all must be `true`):
#   - coherence_safety   : at most one cache in M (the coherence invariant)
#   - deadlock_freedom   : every reachable state has an enabled transition
#   - write_visibility   : a write is always eventually visible in memory
#                          (nu/mu alternation — the liveness shape)

[project]
name = "V4_MESI_N2"
description = "V.4 parametric MESI — 2 L1 caches + shared memory. Coherence safety + deadlock-freedom + eventual write visibility."

[[sources]]
id = "C0"
adapter = "ctxdsl"
files = ["cache_0.ctxdsl"]

[[sources]]
id = "C1"
adapter = "ctxdsl"
files = ["cache_1.ctxdsl"]

[[sources]]
id = "Memory"
adapter = "ctxdsl"
files = ["memory.ctxdsl"]

[alphabet]
strategy = "direct"

[composition]
semantics = "asynchronous"
members = ["C0", "C1", "Memory"]
name = "MesiSystem"

[[properties]]
# At most one cache in Modified ⇒ no two M copies (C(N,2) pairwise terms).
name = "coherence_safety"
formula = "nu X. (!(C0_M && C1_M) && [] X)"
over = "MesiSystem"

[[properties]]
name = "deadlock_freedom"
template = "no_deadlock"
over = "MesiSystem"

[[properties]]
# Eventual write visibility (nu Y. (mu X. (Mem_Written || <> X)) && [] Y).
name = "write_visibility"
template = "always_eventually"
args = { TARGET = "Mem_Written" }
over = "MesiSystem"
