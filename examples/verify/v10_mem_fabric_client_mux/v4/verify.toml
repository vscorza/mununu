# mem_fabric client-mux variant V4. GENERATED by ../generate.py —
# do not hand-edit.
#
# registered mux + the fabric holds the request until accepted, with backpressure absorbing a coincident grant.

[project]
name = "MemFabricV4"
description = "monono mem_fabric client-mux variant V4: is a duplicate or skipped issue reachable?"

[[sources]]
id = "Fabric"
adapter = "ctxdsl"
files = ["fabric_v4.ctxdsl"]

[alphabet]
strategy = "direct"

[composition]
semantics = "asynchronous"
members = ["Fabric"]
name = "FabricSys"

[[properties]]
# THE question: is the same address ever handed to sdram_burst twice?
name = "duplicate_issue_reachable"
template = "reachable"
args = { TARGET = "DUP" }
over = "FabricSys"

[[properties]]
# The dual failure: is a word ever skipped (never issued at all)?
name = "skipped_word_reachable"
template = "reachable"
args = { TARGET = "SKIP" }
over = "FabricSys"

[[properties]]
# NON-VACUITY GATE (mandatory). If the clean completion is not reachable
# the model is stuck and the two verdicts above mean nothing.
name = "clean_completion_reachable"
template = "reachable"
args = { TARGET = "DONE" }
over = "FabricSys"

[[properties]]
# Starvation / deadlock-freedom: from every reachable state, can the
# stream still complete? A refusing memory must only DELAY the client,
# never wedge it. AG EF DONE — branching-time recoverability, which is
# the sound liveness question to ask of an over-approximating model with
# no fairness constraint on sdram_burst.
name = "never_wedged"
formula = "nu Z . ((mu Y . (DONE || (<> Y))) && ([] Z))"
over = "FabricSys"
