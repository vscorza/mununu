# v1_noc_mesh_4router / contention — V.1 of the §Phase 7 domain-validation track.
# Controlling doc: docs/design/industrial-value-and-validation-domains.md §4 (NoC
# liveness). GENERATED by ../generate.py — do not hand-edit.
#
# Single flit R0 -> R3 across a 2x2 mesh. Discriminating verdict:
#   liveness_inevitable = false (an unfair all-stall path never delivers)
# liveness_possible (AG EF) + deadlock_freedom + hop_bound + delivered_at_diameter
# hold in BOTH disciplines. Sharp-everywhere explicit model; definite 2-valued
# verdicts directly. The `hops` counter binds via the CTXDSL variable-atom path.

[project]
name = "V1_NoC_Contention"
description = "V.1 4-router NoC liveness, contention scheduler. Deadlock-freedom + end-to-end liveness (possibility always; inevitability only under a fair scheduler) + bounded (<= diameter) delivery over a hop counter."

[[sources]]
id = "Noc"
adapter = "ctxdsl"
files = ["noc_contention.ctxdsl"]

[alphabet]
strategy = "direct"

[composition]
semantics = "asynchronous"
members = ["Noc"]
name = "NocSystem"

[[properties]]
# Every reachable state has an enabled transition (R3's stutter keeps it live).
name = "deadlock_freedom"
template = "no_deadlock"
over = "NocSystem"

[[properties]]
# AG EF delivered: delivery REMAINS reachable from every reachable state.
name = "liveness_possible"
template = "always_eventually"
args = { TARGET = "delivered" }
over = "NocSystem"

[[properties]]
# AF delivered: on EVERY path the flit is eventually delivered (inevitability).
# TRUE under progress; FALSE under contention (the unfair stall path starves it).
name = "liveness_inevitable"
formula = "mu X. (delivered || ([] X && <> true))"
over = "NocSystem"

[[properties]]
# Bounded delivery (safety over the counter): hops never exceeds the diameter.
name = "hop_bound"
formula = "nu X. (hops <= 2 && [] X)"
over = "NocSystem"

[[properties]]
# Bounded delivery (reachability over the counter): delivered at exactly 2 hops.
name = "delivered_at_diameter"
formula = "mu X. ((delivered && hops == 2) || <> X)"
over = "NocSystem"
