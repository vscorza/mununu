[project]
name = "V3_SpecSafe_Vulnerable"
description = "V.3 speculative non-interference, vulnerable design. Self-composed speculative-load side channel; never(Leak) is the contract-conformance verdict."

[[sources]]
id = "Spec"
adapter = "ctxdsl"
files = ["spec_vulnerable.ctxdsl"]

[alphabet]
strategy = "direct"

[composition]
semantics = "asynchronous"
members = ["Spec"]
name = "SpecSystem"

[[properties]]
# Non-interference / contract conformance: the two copies' observable cache
# footprints never disagree ⇒ no secret-dependent cache trace.
name = "noninterference"
template = "never"
args = { BAD = "Leak" }
over = "SpecSystem"

[[properties]]
# Non-vacuity witness (dual of noninterference): the leak IS observable.
name = "leak_reachable"
template = "reachable"
args = { TARGET = "Leak" }
over = "SpecSystem"

[[properties]]
# Sanity: every reachable product state has an enabled transition.
name = "deadlock_freedom"
template = "no_deadlock"
over = "SpecSystem"
