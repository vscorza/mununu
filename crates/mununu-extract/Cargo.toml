[package]
name = "mununu-extract"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
authors = ["Mariano Cerrutti <vscorza@gmail.com>"]
description = "Mununu extraction frontend — AST-based model extraction from source code"
repository = "https://github.com/vscorza/mununu"
license-file = "../../LICENSE"

[[bin]]
name = "mununu-extract"
path = "src/main.rs"

[dependencies]
mununu-core = { path = "../mununu-core", features = ["ast-extract"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
