[package]
name = "mununu-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
authors = ["Mariano Cerrutti <vscorza@gmail.com>"]
description = "Mununu core library — verification engine, adapters, composition, evaluation"
repository = "https://github.com/vscorza/mununu"
license-file = "../../LICENSE"

[dependencies]
# Core
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitvec = "1.0"
smallvec = "1.15"
regex = "1.12"

# API (optional)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace", "timeout"] }
tokio = { version = "1", optional = true, features = ["full"] }
tracing = { version = "0.1", optional = true }

# AST extraction (optional — tree-sitter grammars for source code analysis)
tree-sitter = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-gdscript = { version = "6", optional = true }

# SMT solver (optional — z3 for value discovery in RTL verification)
z3 = { version = "0.20", optional = true, features = ["bundled"] }

[dev-dependencies]
criterion = "0.8"
proptest = "1.9"
tempfile = "3.24"
itoa = "1.0"

[features]
default = []
api = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio", "dep:tracing"]
ast-extract = ["dep:tree-sitter", "dep:tree-sitter-typescript", "dep:tree-sitter-python", "dep:tree-sitter-rust", "dep:tree-sitter-gdscript"]
smt = ["dep:z3"]
syntcomp = []

[[bench]]
name = "clts_composition"
harness = false

[[bench]]
name = "mu_calculus"
harness = false

[[bench]]
name = "controller"
harness = false

[[bench]]
name = "xstate"
harness = false
