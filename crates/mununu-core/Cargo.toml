[package]
name = "mununu-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
authors = ["Mariano Cerrutti <vscorza@gmail.com>"]
description = "Mununu core library — verification engine, adapters, composition, evaluation"
repository = "https://github.com/vscorza/mununu"
license-file = "../../LICENSE"
# Mununu Non-Commercial License → not for crates.io; marks this a private/own
# crate so the cargo-deny license gate skips it (deny.toml).
publish = false

[dependencies]
# Core
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitvec = "1.0"
smallvec = "1.15"
regex = "1.12"

# OxiDD — pure-Rust decision-diagram framework (BDD). Backs the R-F5 symbolic
# abstraction path: predicate-cube state sets + the may/must transition relation as
# BDDs, with fixpoint image/preimage via the native fused relational product
# `apply_exists(And, …)` — the alternative to explicit-cube enumeration + the
# O(2^2|P|) SMT edge computation. Pure-Rust (no new C build), permissive
# (MIT OR Apache-2.0), `Send + Sync` manager. Not feature-gated — the symbolic path
# is a first-class engine (R-F5).
oxidd = "0.11"

# CMSIS-SVD / IP-XACT importer for register-map sidecars (Document C
# task C6). Small, zero-dep DOM parser well-suited to one-shot config
# parsing. Pulled in unconditionally because `codesign::svd_import` is
# a default feature of the codesign module — the importer is the only
# realistic way to author register maps for any non-toy peripheral.
roxmltree = "0.20"

# TOML parser for the `verify.toml` general verification-project schema
# (verify::config) and its `mununu.codesign.toml` shorthand
# (codesign::project_config). Pulled in unconditionally because both
# schemas are part of the default core surface.
toml = "0.8"

# Tracing — used unconditionally for structured diagnostics (gap markers,
# soundness warnings, perf instrumentation). No-op when no subscriber is
# installed, so the cost is negligible for library callers.
tracing = "0.1"

# VCD parser — used by §Phase 9 R-S6 (VCD trace mining). Reads
# IEEE-1364 Value Change Dump files produced by Verilator / VCS /
# QuestaSim / Icarus regression suites; mininu mines them for
# observed-value-frequency seeding of the bit-blaster's EnumValues
# discriminators. Canonical Rust VCD crate (~3 KLOC, narrow scope,
# stable API since 2018). Per CLAUDE.md "Code Reuse" — established
# library beats hand-rolling.
vcd = "0.7"

# API (optional)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace", "timeout"] }
tokio = { version = "1", optional = true, features = ["full"] }

# AST extraction (optional — tree-sitter grammars for source code analysis)
tree-sitter = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }

# SMT solver — z3 for predicate-image discovery and RTL value discovery.
# Mandatory dependency since Phase A.4 step 4.2. Uses the system Z3
# (libz3-dev on Debian / Z3 via homebrew on macOS) by default — the
# dev-container Dockerfile installs `libz3-dev`. To build with the
# bundled Z3 source (slower; runner-OOM-prone in CI), enable the
# `z3/bundled` feature explicitly:
#   cargo build --features z3/bundled
z3 = { version = "0.20" }

# Optional / feature-gated:
#   `test_support`: deterministic CLTS generators (chain/ring/grid/hypercube/...)
#       used by tests, proptests, stress tests, and the bench harness fixtures.
#   `stress`: gates the tier-3 stress tests in tests/stress_*.rs.
#   `dhat`: enables the dhat heap profiler in stress tests.
# These features pull `rand`/`rand_chacha` (deterministic via ChaCha20Rng) and
# `dhat` only when needed, so release builds and the default feature set stay
# allocation-free of test machinery.
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
dhat = { version = "0.3", optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1.9"
tempfile = "3.24"
itoa = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[features]
default = []
api = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio"]
ast-extract = ["dep:tree-sitter", "dep:tree-sitter-typescript", "dep:tree-sitter-python", "dep:tree-sitter-rust"]
syntcomp = []
# Optimization-programme features (see notebook/0000-overview.md). Each is
# additive and can be enabled per-bench, per-test, or per-CI-tier.
test_support = ["dep:rand", "dep:rand_chacha"]
stress = ["test_support"]
dhat = ["dep:dhat"]

[[test]]
name = "api_graph_valuations"
required-features = ["api"]

[[bench]]
name = "clts_composition"
harness = false

[[bench]]
name = "mu_calculus"
harness = false

[[bench]]
name = "controller"
harness = false

[[bench]]
name = "xstate"
harness = false

[[bench]]
name = "predicate_cube_lift"
harness = false

[[bench]]
name = "lazy_lift"
harness = false

# Optimization-programme isolated benches. Each requires the test_support
# feature for deterministic CLTS generators (rand_chacha::ChaCha20Rng).
# Run with:
#   cargo bench --features test_support --bench <name>
[[bench]]
name = "clts_construction"
harness = false
required-features = ["test_support"]

[[bench]]
name = "composition_only"
harness = false
required-features = ["test_support"]

[[bench]]
name = "minimization_only"
harness = false
required-features = ["test_support"]

[[bench]]
name = "mu_calculus_only"
harness = false
required-features = ["test_support"]

# dhat memory-profile binary for EXP-0002b-mem. Replays the
# synthesis_product_game/grid_32x32 workload with dhat's heap profiler
# wired to the global allocator. Produces dhat-heap.json in cwd; archive
# alongside the EXP. Requires both test_support (for the fixture) and
# dhat (for the profiler).
[[bin]]
name = "dhat_synthesis"
path = "src/bin/dhat_synthesis.rs"
required-features = ["test_support", "dhat"]
